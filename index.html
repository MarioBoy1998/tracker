<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Table Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #0a0a0a;
  color: #e0e0e0;
  min-height: 100vh;
}

.header {
  background: #111;
  border-bottom: 1px solid #222;
  padding: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 15px;
}

.header h1 {
  font-size: 24px;
  font-weight: 600;
  color: #fff;
}

.status-badge {
  padding: 6px 16px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.status-badge.connected {
  background: #15803d;
  color: #fff;
}

.status-badge.disconnected {
  background: #991b1b;
  color: #fff;
}

.status-badge.connecting {
  background: #b45309;
  color: #fff;
}

.stats {
  background: #111;
  border-bottom: 1px solid #222;
  padding: 15px 20px;
  display: flex;
  justify-content: center;
  gap: 40px;
  flex-wrap: wrap;
}

.stat {
  text-align: center;
}

.stat-value {
  font-size: 28px;
  font-weight: 700;
  color: #fff;
}

.stat-label {
  font-size: 11px;
  color: #888;
  margin-top: 4px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.rooms-container {
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.room-card {
  background: #111;
  border: 1px solid #222;
  border-radius: 12px;
  overflow: hidden;
}

.room-card.offline {
  opacity: 0.5;
}

.room-header {
  background: #1a1a1a;
  padding: 15px 20px;
  border-bottom: 1px solid #222;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.room-title {
  font-size: 18px;
  font-weight: 600;
  color: #fff;
}

.room-status {
  padding: 4px 12px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 600;
}

.room-status.online {
  background: #15803d;
  color: #fff;
}

.room-status.offline {
  background: #991b1b;
  color: #fff;
}

.room-body {
  padding: 20px;
}

.tables-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 12px;
}

.table-item {
  background: #0a0a0a;
  border: 2px solid #222;
  border-radius: 12px;
  padding: 12px;
  text-align: center;
  transition: all 0.2s;
  position: relative;
}

.table-item:hover {
  border-color: #333;
  transform: translateY(-2px);
}

.table-item.active {
  border-color: #15803d;
  background: #0f1f13;
}

.table-item.warning {
  border-color: #b45309;
  background: #1a1107;
}

.table-item.inactive {
  border-color: #991b1b;
  background: #1a0808;
}

.table-item.stale {
  border-color: #444;
  background: #0f0f0f;
  opacity: 0.6;
}

.table-id {
  font-size: 20px;
  font-weight: 700;
  color: #fff;
  margin-bottom: 4px;
}

.table-rssi {
  font-size: 13px;
  color: #888;
  margin-bottom: 4px;
}

.table-status {
  font-size: 11px;
  color: #666;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 2px;
}

.table-time {
  font-size: 10px;
  color: #555;
}

.empty-state {
  text-align: center;
  padding: 40px;
  color: #555;
}

.empty-state-icon {
  font-size: 48px;
  margin-bottom: 10px;
  opacity: 0.3;
}

.empty-state-text {
  font-size: 14px;
}

.loading {
  text-align: center;
  padding: 60px 20px;
  color: #666;
}

.spinner {
  border: 3px solid #222;
  border-top: 3px solid #666;
  border-radius: 50%;
  width: 40px;
  height: 40px;
  animation: spin 1s linear infinite;
  margin: 0 auto 15px;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

#debug {
  position: fixed;
  bottom: 10px;
  right: 10px;
  background: #111;
  border: 1px solid #333;
  padding: 10px;
  border-radius: 8px;
  font-size: 11px;
  max-width: 300px;
  color: #888;
}

@media (max-width: 768px) {
  .header h1 {
    font-size: 20px;
  }
  
  .stats {
    gap: 20px;
  }
  
  .stat-value {
    font-size: 24px;
  }
  
  .tables-grid {
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 10px;
  }
  
  #debug {
    font-size: 9px;
    max-width: 200px;
  }
}
</style>
</head>
<body>

<div class="header">
  <h1>🎯 Table Tracker</h1>
  <div class="status-badge connecting" id="status">Connecting...</div>
</div>

<div class="stats">
  <div class="stat">
    <div class="stat-value" id="stat-rooms">0</div>
    <div class="stat-label">Rooms</div>
  </div>
  <div class="stat">
    <div class="stat-value" id="stat-tables">0</div>
    <div class="stat-label">Tables</div>
  </div>
  <div class="stat">
    <div class="stat-value" id="stat-active">0</div>
    <div class="stat-label">Active</div>
  </div>
  <div class="stat">
    <div class="stat-value" id="stat-masters">0</div>
    <div class="stat-label">Masters</div>
  </div>
</div>

<div class="rooms-container" id="rooms">
  <div class="loading">
    <div class="spinner"></div>
    <div>Connecting to Firebase...</div>
  </div>
</div>

<div id="debug">
  <div>Source: <span style="color:#22c55e">Firebase</span></div>
  <div>Rooms: <span id="debug-rooms">0</span></div>
  <div>Tables: <span id="debug-tables">0</span></div>
  <div>Last update: <span id="debug-time">-</span></div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
// ================= FIREBASE CONFIG =================
const firebaseConfig = {
  databaseURL: "https://table-tracker-712c8-default-rtdb.europe-west1.firebasedatabase.app"
};

// ================= CONFIG =================
const MASTER_TIMEOUT = 30000;        // 30 секунд
const TABLE_WARNING_TIMEOUT = 45000;  // 45 секунд
const TABLE_INACTIVE_TIMEOUT = 120000; // 2 хвилини

// ================= INIT =================
firebase.initializeApp(firebaseConfig);
const database = firebase.database();

console.log('🚀 Firebase Table Tracker Started');
console.log('📡 Listening to: /rooms/');

// ================= DATA =================
let roomsData = {};

// ================= FIREBASE LISTENER =================
database.ref('/rooms').on('value', (snapshot) => {
  console.log('\n📥 Firebase data received');
  
  const data = snapshot.val();
  
  if (!data) {
    console.log('⚠️  No data in Firebase');
    updateStatus('disconnected', 'No Data');
    render({}, 0, 0, 0, 0);
    return;
  }
  
  console.log('✅ Raw data:', data);
  
  roomsData = data;
  processAndRender();
  
  updateStatus('connected', 'Connected');
}, (error) => {
  console.error('❌ Firebase error:', error);
  updateStatus('disconnected', 'Error');
});

// ================= PROCESS =================
function processAndRender() {
  const now = Date.now();
  
  console.log('\n🔄 Processing Firebase data...');
  
  let rooms = {};
  let totalTables = 0;
  let activeCount = 0;
  let activeMasters = 0;
  
  for (let roomName in roomsData) {
    const roomData = roomsData[roomName];
    
    console.log(`  📦 Room: ${roomName}`);
    console.log(`     Master: ${roomData.master_id}`);
    console.log(`     Updated: ${roomData.updated} (${new Date(roomData.updated * 1000).toLocaleTimeString()})`);
    console.log(`     Tables: ${roomData.tables?.length || 0}`);
    
    // Перевірити чи мастер активний
    const updatedTimestamp = roomData.updated * 1000; // Convert to ms
    const age = now - updatedTimestamp;
    const isActive = age < MASTER_TIMEOUT;
    
    console.log(`     Age: ${Math.round(age/1000)}s - ${isActive ? '✅ ACTIVE' : '❌ TIMEOUT'}`);
    
    if (isActive) {
      activeMasters++;
    }
    
    rooms[roomName] = {
      active: isActive,
      master_id: roomData.master_id,
      room_name: roomData.room_name,
      tables: []
    };
    
    // Process tables
    if (roomData.tables && Array.isArray(roomData.tables)) {
      roomData.tables.forEach(table => {
        totalTables++;
        
        const lastSeen = table.last_seen || 0;
        
        let status = 'active';
        if (lastSeen > TABLE_INACTIVE_TIMEOUT) {
          status = 'inactive';
        } else if (lastSeen > TABLE_WARNING_TIMEOUT) {
          status = 'warning';
        } else {
          activeCount++;
        }
        
        console.log(`       - Table ${table.id}: ${table.rssi} dBm, ${Math.round(lastSeen/1000)}s ago [${status}]`);
        
        rooms[roomName].tables.push({
          id: table.id,
          rssi: table.rssi,
          last_seen: lastSeen,
          status: status,
          room: table.room || roomName
        });
      });
    }
  }
  
  const roomCount = Object.keys(rooms).length;
  
  console.log(`\n📊 Summary:`);
  console.log(`   Rooms: ${roomCount}`);
  console.log(`   Masters: ${activeMasters} active`);
  console.log(`   Tables: ${totalTables} total, ${activeCount} active`);
  
  updateDebug(roomCount, totalTables);
  render(rooms, roomCount, totalTables, activeCount, activeMasters);
}

// ================= RENDER =================
function render(rooms, roomCount, tableCount, activeCount, masterCount) {
  console.log(`\n🎨 Rendering ${roomCount} rooms...`);
  
  if (!rooms || Object.keys(rooms).length === 0) {
    document.getElementById('rooms').innerHTML = `
      <div class="loading">
        <div class="spinner"></div>
        <div>Waiting for data from Firebase...</div>
      </div>`;
    updateStats(0, 0, 0, 0);
    return;
  }
  
  let html = '';
  let roomNames = Object.keys(rooms).sort();
  
  roomNames.forEach(roomName => {
    let room = rooms[roomName];
    let tables = room.tables || [];
    let isActive = room.active !== false;
    
    console.log(`  - ${roomName}: ${tables.length} tables, ${isActive ? 'online' : 'offline'}`);
    
    tables.sort((a, b) => parseInt(a.id) - parseInt(b.id));
    
    html += `
    <div class="room-card ${isActive ? '' : 'offline'}">
      <div class="room-header">
        <div class="room-title">${roomName} <span style="font-size:12px;color:#666;font-weight:400">(${room.master_id})</span></div>
        <div class="room-status ${isActive ? 'online' : 'offline'}">
          ${isActive ? 'Online' : 'Offline'}
        </div>
      </div>
      <div class="room-body">`;
    
    if (tables.length === 0) {
      html += `
        <div class="empty-state">
          <div class="empty-state-icon">📭</div>
          <div class="empty-state-text">No tables detected</div>
        </div>`;
    } else {
      html += '<div class="tables-grid">';
      
      tables.forEach(table => {
        let time = table.last_seen < 1000 ? 'now' : 
                   table.last_seen < 60000 ? `${Math.floor(table.last_seen/1000)}s ago` :
                   table.last_seen < 3600000 ? `${Math.floor(table.last_seen/60000)}m ago` :
                   `${Math.floor(table.last_seen/3600000)}h ago`;
        
        html += `
        <div class="table-item ${table.status}">
          <div class="table-id">TX_${table.id}</div>
          <div class="table-rssi">${table.rssi} dBm</div>
          <div class="table-status">${table.status}</div>
          <div class="table-time">${time}</div>
        </div>`;
      });
      
      html += '</div>';
    }
    
    html += '</div></div>';
  });
  
  document.getElementById('rooms').innerHTML = html;
  updateStats(roomCount, tableCount, activeCount, masterCount);
  
  console.log('✅ Render complete');
}

// ================= HELPERS =================
function updateStatus(state, text) {
  const el = document.getElementById('status');
  el.className = `status-badge ${state}`;
  el.textContent = text;
}

function updateStats(rooms, tables, active, masters) {
  document.getElementById('stat-rooms').textContent = rooms;
  document.getElementById('stat-tables').textContent = tables;
  document.getElementById('stat-active').textContent = active;
  document.getElementById('stat-masters').textContent = masters;
}

function updateDebug(rooms, tables) {
  document.getElementById('debug-rooms').textContent = rooms;
  document.getElementById('debug-tables').textContent = tables;
  
  const now = new Date();
  document.getElementById('debug-time').textContent = now.toLocaleTimeString();
}

// Init
console.log('⏳ Waiting for Firebase connection...');
render({}, 0, 0, 0, 0);
</script>
</body>
</html>
