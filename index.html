<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Table Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #0a0a0a;
  color: #e0e0e0;
  min-height: 100vh;
}

/* ========== HEADER ========== */
.header {
  background: #111;
  border-bottom: 1px solid #222;
  padding: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 15px;
}

.header.pro-mode {
  padding: 30px 20px;
  border-bottom: 2px solid #333;
}

.header h1 {
  font-size: 24px;
  font-weight: 600;
  color: #fff;
}

.header.pro-mode h1 {
  font-size: 32px;
  font-weight: 300;
  letter-spacing: 2px;
}

.status-badge {
  padding: 6px 16px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.status-badge.connected {
  background: #15803d;
  color: #fff;
}

.status-badge.disconnected {
  background: #991b1b;
  color: #fff;
}

.status-badge.connecting {
  background: #b45309;
  color: #fff;
}

/* Приховати в PRO режимі */
.header.pro-mode .status-badge {
  display: none;
}

/* ========== STATS ========== */
.stats {
  background: #111;
  border-bottom: 1px solid #222;
  padding: 15px 20px;
  display: flex;
  justify-content: center;
  gap: 40px;
  flex-wrap: wrap;
}

.stats.hidden {
  display: none;
}

.stat {
  text-align: center;
}

.stat-value {
  font-size: 28px;
  font-weight: 700;
  color: #fff;
}

.stat-label {
  font-size: 11px;
  color: #888;
  margin-top: 4px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

/* ========== ROOMS ========== */
.rooms-container {
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.rooms-container.pro-mode {
  padding: 40px;
  gap: 40px;
  max-width: 1400px;
  margin: 0 auto;
}

.room-card {
  background: #111;
  border: 1px solid #222;
  border-radius: 12px;
  overflow: hidden;
}

.room-card.pro-mode {
  background: transparent;
  border: none;
  border-radius: 0;
}

.room-card.offline {
  opacity: 0.5;
}

.room-header {
  background: #1a1a1a;
  padding: 15px 20px;
  border-bottom: 1px solid #222;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.room-header.pro-mode {
  background: transparent;
  padding: 0 0 20px 0;
  border-bottom: 2px solid #333;
  margin-bottom: 30px;
}

.room-title {
  font-size: 18px;
  font-weight: 600;
  color: #fff;
}

.room-title.pro-mode {
  font-size: 28px;
  font-weight: 300;
  letter-spacing: 3px;
  text-transform: uppercase;
}

.room-status {
  padding: 4px 12px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 600;
}

.room-status.online {
  background: #15803d;
  color: #fff;
}

.room-status.offline {
  background: #991b1b;
  color: #fff;
}

/* Приховати в PRO режимі */
.room-status.hidden {
  display: none;
}

.room-body {
  padding: 20px;
}

.room-body.pro-mode {
  padding: 0;
}

/* ========== TABLES GRID ========== */
.tables-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 12px;
}

.tables-grid.pro-mode {
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 20px;
}

.table-item {
  background: #0a0a0a;
  border: 2px solid #222;
  border-radius: 12px;
  padding: 12px;
  text-align: center;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
}

.table-item.pro-mode {
  background: #111;
  border: 3px solid #222;
  border-radius: 20px;
  padding: 30px 20px;
  box-shadow: 0 4px 6px rgba(0,0,0,0.3);
}

.table-item:hover {
  border-color: #333;
  transform: translateY(-2px);
}

.table-item.pro-mode:hover {
  transform: translateY(-4px) scale(1.02);
  box-shadow: 0 8px 12px rgba(0,0,0,0.4);
}

/* STATUS COLORS */
.table-item.active {
  border-color: #15803d;
  background: #0f1f13;
}

.table-item.pro-mode.active {
  border-color: #22c55e;
  background: #0a1f0f;
  box-shadow: 0 4px 20px rgba(34, 197, 94, 0.2);
}

.table-item.warning {
  border-color: #b45309;
  background: #1a1107;
}

.table-item.pro-mode.warning {
  border-color: #f59e0b;
  background: #1a1207;
  box-shadow: 0 4px 20px rgba(245, 158, 11, 0.2);
}

.table-item.inactive {
  border-color: #991b1b;
  background: #1a0808;
}

.table-item.pro-mode.inactive {
  border-color: #ef4444;
  background: #1a0808;
  box-shadow: 0 4px 20px rgba(239, 68, 68, 0.2);
}

.table-item.stale {
  border-color: #444;
  background: #0f0f0f;
  opacity: 0.6;
}

.table-item.pro-mode.stale {
  border-color: #555;
  opacity: 0.4;
}

/* CONFIDENCE BADGE */
.table-confidence {
  position: absolute;
  top: 6px;
  right: 8px;
  font-size: 10px;
  font-weight: 600;
  color: #888;
  background: #1a1a1a;
  padding: 2px 6px;
  border-radius: 8px;
}

.table-confidence.hidden {
  display: none;
}

/* TABLE ID */
.table-id {
  font-size: 20px;
  font-weight: 700;
  color: #fff;
  margin-bottom: 4px;
}

.table-id.pro-mode {
  font-size: 48px;
  font-weight: 300;
  margin-bottom: 0;
  letter-spacing: 2px;
}

/* TABLE DETAILS */
.table-rssi {
  font-size: 13px;
  color: #888;
  margin-bottom: 4px;
}

.table-status {
  font-size: 11px;
  color: #666;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 2px;
}

.table-time {
  font-size: 10px;
  color: #555;
}

/* Приховати деталі в PRO режимі */
.table-rssi.hidden,
.table-status.hidden,
.table-time.hidden {
  display: none;
}

/* ========== EMPTY STATE ========== */
.empty-state {
  text-align: center;
  padding: 40px;
  color: #555;
}

.empty-state.pro-mode {
  padding: 80px 40px;
}

.empty-state-icon {
  font-size: 48px;
  margin-bottom: 10px;
  opacity: 0.3;
}

.empty-state-icon.pro-mode {
  font-size: 72px;
}

.empty-state-text {
  font-size: 14px;
}

.empty-state-text.pro-mode {
  font-size: 18px;
  font-weight: 300;
  letter-spacing: 1px;
}

/* ========== LOADING ========== */
.loading {
  text-align: center;
  padding: 60px 20px;
  color: #666;
}

.spinner {
  border: 3px solid #222;
  border-top: 3px solid #666;
  border-radius: 50%;
  width: 40px;
  height: 40px;
  animation: spin 1s linear infinite;
  margin: 0 auto 15px;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

/* ========== RECONNECT BANNER ========== */
.reconnect-banner {
  background: #b45309;
  color: #fff;
  padding: 10px 20px;
  text-align: center;
  font-size: 13px;
  font-weight: 600;
  display: none;
}

.reconnect-banner.show {
  display: block;
}

.reconnect-banner.hidden {
  display: none;
}

/* ========== DEBUG ========== */
#debug {
  position: fixed;
  bottom: 10px;
  right: 10px;
  background: #111;
  border: 1px solid #333;
  padding: 10px;
  border-radius: 8px;
  font-size: 11px;
  max-width: 300px;
  color: #888;
}

#debug.hidden {
  display: none;
}

/* ========== RESPONSIVE ========== */
@media (max-width: 768px) {
  .header h1 {
    font-size: 20px;
  }
  
  .header.pro-mode h1 {
    font-size: 24px;
  }
  
  .stats {
    gap: 20px;
  }
  
  .stat-value {
    font-size: 24px;
  }
  
  .tables-grid {
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 10px;
  }
  
  .tables-grid.pro-mode {
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 15px;
  }
  
  .table-id.pro-mode {
    font-size: 36px;
  }
  
  .room-title.pro-mode {
    font-size: 20px;
  }
  
  #debug {
    font-size: 9px;
    max-width: 200px;
  }
}
</style>
</head>
<body>

<div class="header" id="header">
  <h1>🎯 Table Tracker</h1>
  <div class="status-badge connecting" id="status">Connecting...</div>
</div>

<div class="reconnect-banner" id="reconnect-banner">
  ⚠️ Reconnecting to Firebase... Showing cached data
</div>

<div class="stats" id="stats">
  <div class="stat">
    <div class="stat-value" id="stat-rooms">0</div>
    <div class="stat-label">Rooms</div>
  </div>
  <div class="stat">
    <div class="stat-value" id="stat-tables">0</div>
    <div class="stat-label">Tables</div>
  </div>
  <div class="stat">
    <div class="stat-value" id="stat-active">0</div>
    <div class="stat-label">Active</div>
  </div>
  <div class="stat">
    <div class="stat-value" id="stat-masters">0</div>
    <div class="stat-label">Masters</div>
  </div>
</div>

<div class="rooms-container" id="rooms">
  <div class="loading">
    <div class="spinner"></div>
    <div>Waiting for data...</div>
  </div>
</div>

<div id="debug">
  <div>Mode: <span id="debug-mode" style="color:#22c55e">DEV</span></div>
  <div>Connection: <span id="debug-connection" style="color:#b45309">connecting</span></div>
  <div>Masters: <span id="debug-masters">0</span></div>
  <div>Tables: <span id="debug-tables">0</span></div>
  <div>Updates: <span id="debug-updates">0</span></div>
  <div>Last update: <span id="debug-time">-</span></div>
  <div style="margin-top:5px;padding-top:5px;border-top:1px solid #333;font-size:9px;color:#666;">
    Console: APP_CONFIG.PRO_MODE = true/false
  </div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
// ================= 🎨 CONFIG - ЗМІНЮЙ ЧЕРЕЗ CONSOLE =================
window.APP_CONFIG = {
  PRO_MODE: false,           // true = чистий дизайн, false = показати все
  SHOW_CONFIDENCE: false,    // Показувати відсотки впевненості
  SHOW_RSSI: false,          // Показувати dBm
  SHOW_STATUS_TEXT: false,   // Показувати текст статусу
  SHOW_TIME: false,          // Показувати час
  SHOW_STATS: true,          // Показувати верхню статистику
  SHOW_ROOM_STATUS: true,    // Показувати Online/Offline badge
  SHOW_CONNECTION: true,     // Показувати статус підключення
  SHOW_RECONNECT_BANNER: true, // Показувати reconnect banner
  SHOW_DEBUG: true           // Показувати debug panel
};

// Функція для застосування режиму
function applyDisplayMode() {
  const config = window.APP_CONFIG;
  
  console.log('🎨 Applying display mode:', config.PRO_MODE ? 'PRO' : 'DEV');
  
  // Update debug mode indicator
  const debugMode = document.getElementById('debug-mode');
  if (debugMode) {
    debugMode.textContent = config.PRO_MODE ? 'PRO' : 'DEV';
    debugMode.style.color = config.PRO_MODE ? '#a855f7' : '#22c55e';
  }
  
  // Header
  const header = document.getElementById('header');
  if (header) {
    header.classList.toggle('pro-mode', config.PRO_MODE);
  }
  
  // Stats
  const stats = document.getElementById('stats');
  if (stats) {
    stats.classList.toggle('hidden', config.PRO_MODE || !config.SHOW_STATS);
  }
  
  // Debug
  const debug = document.getElementById('debug');
  if (debug) {
    debug.classList.toggle('hidden', config.PRO_MODE || !config.SHOW_DEBUG);
  }
  
  // Reconnect banner
  const banner = document.getElementById('reconnect-banner');
  if (banner) {
    banner.classList.toggle('hidden', config.PRO_MODE || !config.SHOW_RECONNECT_BANNER);
  }
  
  // Connection status badge
  const status = document.getElementById('status');
  if (status) {
    status.style.display = (config.PRO_MODE || !config.SHOW_CONNECTION) ? 'none' : 'inline-flex';
  }
  
  // Rooms container
  const roomsContainer = document.getElementById('rooms');
  if (roomsContainer) {
    roomsContainer.classList.toggle('pro-mode', config.PRO_MODE);
  }
  
  // Trigger re-render
  if (lastCachedRooms) {
    const stats = calculateStats(lastCachedRooms);
    render(lastCachedRooms, stats.roomCount, stats.tableCount, stats.activeCount, stats.masterCount);
  }
  
  console.log('✅ Display mode applied');
}

// Слухати зміни конфігу
let configProxy = new Proxy(window.APP_CONFIG, {
  set: function(target, property, value) {
    console.log(`🔧 Config change: ${property} = ${value}`);
    target[property] = value;
    applyDisplayMode();
    return true;
  }
});
window.APP_CONFIG = configProxy;

console.log('💡 PRO MODE CONTROLS:');
console.log('   APP_CONFIG.PRO_MODE = true     // Увімкнути PRO режим');
console.log('   APP_CONFIG.PRO_MODE = false    // Вимкнути PRO режим');
console.log('   APP_CONFIG.SHOW_CONFIDENCE = true/false');
console.log('   APP_CONFIG.SHOW_RSSI = true/false');
console.log('   APP_CONFIG.SHOW_STATUS_TEXT = true/false');
console.log('   APP_CONFIG.SHOW_TIME = true/false');

// ================= GLOBAL ERROR HANDLER =================
window.addEventListener('error', (event) => {
  console.error('🔥 CRITICAL ERROR:', event.error);
  event.preventDefault();
});

window.addEventListener('unhandledrejection', (event) => {
  console.error('🔥 UNHANDLED PROMISE REJECTION:', event.reason);
  event.preventDefault();
});

// ================= FIREBASE CONFIG =================
const firebaseConfig = {
  databaseURL: "https://table-tracker-712c8-default-rtdb.europe-west1.firebasedatabase.app"
};

firebase.initializeApp(firebaseConfig);
const database = firebase.database();

// ================= CONFIG =================
const MASTER_TIMEOUT = 15000;
const TABLE_WARNING_TIMEOUT = 30000;
const TABLE_INACTIVE_TIMEOUT = 900000;
const TABLE_STALE_TIMEOUT = 1800000;
const CLEANUP_INTERVAL = 3600000;

const SIGNAL_FRESHNESS_THRESHOLD = 30000;
const RSSI_DIFFERENCE_THRESHOLD = 10;
const MIN_RSSI_FOR_ROOM = -90;

const UPDATE_DEBOUNCE_MS = 500;
const CACHE_KEY = 'table_tracker_cache';

// ================= DATA =================
let masters = {};
let tables = {};
let tableHistory = {};
let lastRenderTime = 0;
let updateCount = 0;
let updateDebounceTimer = null;
let isProcessing = false;
let isConnected = false;
let hasReceivedData = false;
let lastCachedRooms = null;

// ================= CACHE FUNCTIONS =================
function saveToCache() {
  try {
    const cacheData = {
      masters: masters,
      tables: tables,
      tableHistory: tableHistory,
      timestamp: Date.now()
    };
    localStorage.setItem(CACHE_KEY, JSON.stringify(cacheData));
    console.log('💾 Data cached to localStorage');
  } catch (error) {
    console.error('❌ Error saving to cache:', error);
  }
}

function loadFromCache() {
  try {
    const cached = localStorage.getItem(CACHE_KEY);
    if (!cached) return false;
    
    const cacheData = JSON.parse(cached);
    const age = Date.now() - cacheData.timestamp;
    
    if (age > 300000) {
      console.log('⚠️ Cache too old, ignoring');
      return false;
    }
    
    masters = cacheData.masters || {};
    tables = cacheData.tables || {};
    tableHistory = cacheData.tableHistory || {};
    
    console.log(`📂 Loaded from cache (${Math.round(age/1000)}s old)`);
    console.log(`   Masters: ${Object.keys(masters).length}`);
    console.log(`   Tables: ${Object.keys(tables).length}`);
    
    processAndRender();
    hasReceivedData = true;
    
    return true;
  } catch (error) {
    console.error('❌ Error loading from cache:', error);
    return false;
  }
}

// ================= FIREBASE CONNECTION TRACKING =================
const connectedRef = database.ref('.info/connected');
connectedRef.on('value', (snap) => {
  isConnected = snap.val() === true;
  
  const debugConn = document.getElementById('debug-connection');
  const reconnectBanner = document.getElementById('reconnect-banner');
  
  if (isConnected) {
    console.log('✅ Firebase CONNECTED');
    updateStatus('connected', 'Connected');
    if (debugConn) {
      debugConn.textContent = 'connected';
      debugConn.style.color = '#22c55e';
    }
    if (reconnectBanner && window.APP_CONFIG.SHOW_RECONNECT_BANNER && !window.APP_CONFIG.PRO_MODE) {
      reconnectBanner.classList.remove('show');
    }
  } else {
    console.log('❌ Firebase DISCONNECTED');
    
    if (hasReceivedData) {
      updateStatus('connecting', 'Reconnecting...');
      if (reconnectBanner && window.APP_CONFIG.SHOW_RECONNECT_BANNER && !window.APP_CONFIG.PRO_MODE) {
        reconnectBanner.classList.add('show');
      }
    } else {
      updateStatus('disconnected', 'Disconnected');
    }
    
    if (debugConn) {
      debugConn.textContent = 'disconnected';
      debugConn.style.color = '#dc2626';
    }
  }
});

// ================= FIREBASE LISTENER =================
console.log('🚀 Starting Table Tracker (Firebase)...');

const hasCachedData = loadFromCache();

database.ref('/rooms').on('value', (snapshot) => {
  try {
    updateCount++;
    console.log(`📨 Firebase update #${updateCount} received`);
    
    if (updateDebounceTimer) {
      clearTimeout(updateDebounceTimer);
    }
    
    updateDebounceTimer = setTimeout(() => {
      handleFirebaseUpdate(snapshot);
    }, UPDATE_DEBOUNCE_MS);
    
  } catch (error) {
    console.error('❌ Error in Firebase listener:', error);
  }
}, (error) => {
  console.error('❌ Firebase error:', error);
  updateStatus('disconnected', 'Error');
});

// ================= FIREBASE UPDATE HANDLER =================
function handleFirebaseUpdate(snapshot) {
  if (isProcessing) {
    console.log('⏸️  Already processing, skip this update');
    return;
  }
  
  try {
    isProcessing = true;
    
    const data = snapshot.val();
    
    if (!data) {
      console.log('⚠️ No data from Firebase');
      
      if (!hasReceivedData && !hasCachedData) {
        updateStatus('disconnected', 'No Data');
      }
      
      isProcessing = false;
      return;
    }
    
    hasReceivedData = true;
    
    const reconnectBanner = document.getElementById('reconnect-banner');
    if (reconnectBanner) {
      reconnectBanner.classList.remove('show');
    }
    
    updateStatus('connected', 'Connected');
    
    for (let roomName in data) {
      try {
        const roomData = data[roomName];
        const masterId = roomData.master_id || 'unknown';
        
        console.log(`  Master ${masterId}: room=${roomName}, tables=${roomData.tables?.length || 0}`);
        
        const mqttLikeData = {
          room: roomName,
          master_id: masterId,
          tables: roomData.tables || []
        };
        
        handleMasterData(masterId, mqttLikeData);
      } catch (error) {
        console.error(`❌ Error processing room ${roomName}:`, error);
      }
    }
    
    saveToCache();
    
  } catch (error) {
    console.error('❌ Error in handleFirebaseUpdate:', error);
  } finally {
    isProcessing = false;
  }
}

// ================= HISTORY =================
function updateTableHistory(tableId, roomName, rssi, timestamp) {
  try {
    if (!tableHistory[tableId]) {
      tableHistory[tableId] = [];
    }

    tableHistory[tableId].push({
      room: roomName,
      rssi: rssi,
      timestamp: timestamp
    });

    if (tableHistory[tableId].length > 2) {
      tableHistory[tableId].shift();
    }
  } catch (error) {
    console.error(`❌ Error updating history for table ${tableId}:`, error);
  }
}

function calculateConfidence(tableId, roomName) {
  try {
    if (!tableHistory[tableId] || tableHistory[tableId].length === 0) {
      return 0.5;
    }

    const recentHistory = tableHistory[tableId].slice(-2);
    const roomCount = recentHistory.filter(h => h.room === roomName).length;

    return roomCount / recentHistory.length;
  } catch (error) {
    console.error(`❌ Error calculating confidence for table ${tableId}:`, error);
    return 0.5;
  }
}

// ================= HANDLERS =================
function handleMasterData(masterId, data) {
  try {
    const now = Date.now();
    
    masters[masterId] = {
      room: data.room,
      master_id: data.master_id,
      lastSeen: now,
      active: true
    };
    
    console.log(`  ✅ Master ${masterId} saved: room=${data.room}`);
    
    (data.tables || []).forEach(table => {
      try {
        const tableId = table.id;
        const rssi = table.rssi;
        const lastSeen = table.last_seen || 0;
        
        if (!tables[tableId]) {
          tables[tableId] = { signals: [] };
          console.log(`    [+] New table: TX_${tableId}`);
        }
        
        const existingIndex = tables[tableId].signals.findIndex(
          s => s.master_id === data.master_id
        );
        
        const signal = {
          room: data.room,
          master_id: data.master_id,
          rssi: rssi,
          timestamp: now - lastSeen
        };
        
        if (existingIndex >= 0) {
          tables[tableId].signals[existingIndex] = signal;
        } else {
          tables[tableId].signals.push(signal);
        }
        
        updateTableHistory(tableId, data.room, rssi, now);
      } catch (error) {
        console.error(`❌ Error processing table ${table?.id}:`, error);
      }
    });
    
    updateDebug();
    processAndRender();
    
  } catch (error) {
    console.error(`❌ Error in handleMasterData for ${masterId}:`, error);
  }
}

// ================= PROCESS =================
function processAndRender() {
  try {
    const now = Date.now();
    
    console.log('\n🔄 Processing...');
    
    let activeMasterCount = 0;
    for (let masterId in masters) {
      if (now - masters[masterId].lastSeen > MASTER_TIMEOUT) {
        if (masters[masterId].active) {
          console.log(`⚠️ Master ${masterId} timeout`);
          masters[masterId].active = false;
        }
      } else {
        activeMasterCount++;
      }
    }
    
    console.log(`  Masters: ${Object.keys(masters).length} total, ${activeMasterCount} active`);
    
    for (let tableId in tables) {
      tables[tableId].signals = tables[tableId].signals.filter(signal => {
        return (now - signal.timestamp) < CLEANUP_INTERVAL;
      });
      
      if (tables[tableId].signals.length === 0) {
        console.log(`  [-] Remove table: TX_${tableId}`);
        delete tables[tableId];
        delete tableHistory[tableId];
      }
    }
    
    console.log(`  Tables: ${Object.keys(tables).length} total`);
    
    let rooms = {};
    
    for (let masterId in masters) {
      if (!masters[masterId].active) continue;
      
      const room = masters[masterId].room;
      if (!rooms[room]) {
        rooms[room] = {
          active: true,
          master_id: masters[masterId].master_id,
          tables: []
        };
        console.log(`  + Room: ${room}`);
      }
    }
    
    let activeCount = 0;
    let warningCount = 0;
    let inactiveCount = 0;
    let staleCount = 0;
    
    for (let tableId in tables) {
      try {
        const signals = tables[tableId].signals;
        if (signals.length === 0) continue;
        
        const lastSignal = signals.reduce((newest, current) => {
          return current.timestamp > newest.timestamp ? current : newest;
        });
        const currentRoom = lastSignal.room;
        
        const signalsByRoom = {};
        signals.forEach(signal => {
          if (!signalsByRoom[signal.room]) signalsByRoom[signal.room] = [];
          signalsByRoom[signal.room].push(signal);
        });
        
        const freshestByRoom = {};
        for (let room in signalsByRoom) {
          freshestByRoom[room] = signalsByRoom[room].reduce((newest, current) => {
            return current.timestamp > newest.timestamp ? current : newest;
          });
        }
        
        const currentRoomSignal = freshestByRoom[currentRoom];
        const currentRoomAge = currentRoomSignal ? (now - currentRoomSignal.timestamp) : Infinity;
        const currentRoomFresh = currentRoomAge < SIGNAL_FRESHNESS_THRESHOLD;
        
        let finalRoom = currentRoom;
        let finalSignal = currentRoomSignal || lastSignal;
        
        if (currentRoomFresh && currentRoomSignal.rssi >= MIN_RSSI_FOR_ROOM) {
          let bestRoom = currentRoom;
          let bestSignal = currentRoomSignal;
          
          for (let room in freshestByRoom) {
            if (room === currentRoom) continue;
            
            const signal = freshestByRoom[room];
            const age = now - signal.timestamp;
            const isFresh = age < SIGNAL_FRESHNESS_THRESHOLD;
            
            if (isFresh && signal.rssi >= MIN_RSSI_FOR_ROOM) {
              if (signal.rssi - bestSignal.rssi > RSSI_DIFFERENCE_THRESHOLD) {
                bestRoom = room;
                bestSignal = signal;
                console.log(`    TX_${tableId}: ${currentRoom} → ${bestRoom} (${bestSignal.rssi} vs ${currentRoomSignal.rssi})`);
              }
            }
          }
          
          finalRoom = bestRoom;
          finalSignal = bestSignal;
          
        } else if (currentRoomFresh && currentRoomSignal.rssi < MIN_RSSI_FOR_ROOM) {
          let bestRoom = null;
          let bestSignal = null;
          
          for (let room in freshestByRoom) {
            const signal = freshestByRoom[room];
            const age = now - signal.timestamp;
            const isFresh = age < SIGNAL_FRESHNESS_THRESHOLD;
            
            if (isFresh && signal.rssi >= MIN_RSSI_FOR_ROOM) {
              if (!bestSignal || signal.rssi > bestSignal.rssi) {
                bestRoom = room;
                bestSignal = signal;
              }
            }
          }
          
          if (bestSignal) {
            finalRoom = bestRoom;
            finalSignal = bestSignal;
            console.log(`    TX_${tableId}: ${currentRoom} → ${bestRoom} (weak current: ${currentRoomSignal.rssi})`);
          }
        } else {
          let emergencyRoom = null;
          let emergencySignal = null;
          
          for (let room in freshestByRoom) {
            const signal = freshestByRoom[room];
            const age = now - signal.timestamp;
            
            if (age < 10000 && signal.rssi >= MIN_RSSI_FOR_ROOM) {
              if (signal.rssi - finalSignal.rssi > RSSI_DIFFERENCE_THRESHOLD * 2) {
                emergencyRoom = room;
                emergencySignal = signal;
                break;
              }
            }
          }
          
          if (emergencySignal) {
            finalRoom = emergencyRoom;
            finalSignal = emergencySignal;
            console.log(`    TX_${tableId}: ${currentRoom} → ${emergencyRoom} (emergency)`);
          }
        }
        
        const lastSeen = now - finalSignal.timestamp;
        const confidence = calculateConfidence(tableId, finalRoom);
        
        let status = 'active';
        if (lastSeen > TABLE_STALE_TIMEOUT) {
          status = 'stale';
          staleCount++;
        } else if (lastSeen > TABLE_INACTIVE_TIMEOUT) {
          status = 'inactive';
          inactiveCount++;
        } else if (lastSeen > TABLE_WARNING_TIMEOUT) {
          status = 'warning';
          warningCount++;
        } else {
          activeCount++;
        }
        
        if (rooms[finalRoom]) {
          rooms[finalRoom].tables.push({
            id: tableId,
            rssi: finalSignal.rssi,
            last_seen: lastSeen,
            status: status,
            confidence: confidence
          });
        }
      } catch (error) {
        console.error(`❌ Error processing table ${tableId}:`, error);
      }
    }
    
    const roomCount = Object.keys(rooms).length;
    const tableCount = Object.keys(tables).length;
    const masterCount = activeMasterCount;
    
    console.log(`📊 Result: ${roomCount} rooms, ${tableCount} tables (✓${activeCount} ⚠${warningCount} ✗${inactiveCount} ⏸${staleCount})`);
    
    lastRenderTime = now;
    lastCachedRooms = rooms;
    render(rooms, roomCount, tableCount, activeCount, masterCount);
    
  } catch (error) {
    console.error('❌ Error in processAndRender:', error);
  }
}

// ================= CALCULATE STATS =================
function calculateStats(rooms) {
  let roomCount = Object.keys(rooms).length;
  let tableCount = 0;
  let activeCount = 0;
  let masterCount = 0;
  
  for (let roomName in rooms) {
    let room = rooms[roomName];
    if (room.active) masterCount++;
    tableCount += room.tables.length;
    activeCount += room.tables.filter(t => t.status === 'active').length;
  }
  
  return { roomCount, tableCount, activeCount, masterCount };
}

// ================= RENDER =================
function render(rooms, roomCount, tableCount, activeCount, masterCount) {
  try {
    const config = window.APP_CONFIG;
    
    console.log(`🎨 Rendering ${roomCount} rooms... (PRO: ${config.PRO_MODE})`);
    
    if (!rooms || Object.keys(rooms).length === 0) {
      if (!hasReceivedData && !hasCachedData) {
        document.getElementById('rooms').innerHTML = `
          <div class="loading">
            <div class="spinner"></div>
            <div>Waiting for data...</div>
          </div>`;
        updateStats(0, 0, 0, 0);
      }
      return;
    }
    
    let html = '';
    let roomNames = Object.keys(rooms).sort();
    
    console.log(`  Rooms to render: ${roomNames.join(', ')}`);
    
    roomNames.forEach(roomName => {
      try {
        let room = rooms[roomName];
        let tables = room.tables || [];
        let isActive = room.active !== false;
        
        console.log(`  - ${roomName}: ${tables.length} tables, ${isActive ? 'online' : 'offline'}`);
        
        tables.sort((a, b) => parseInt(a.id) - parseInt(b.id));
        
        html += `
        <div class="room-card ${config.PRO_MODE ? 'pro-mode' : ''} ${isActive ? '' : 'offline'}">
          <div class="room-header ${config.PRO_MODE ? 'pro-mode' : ''}">
            <div class="room-title ${config.PRO_MODE ? 'pro-mode' : ''}">${roomName}</div>
            <div class="room-status ${isActive ? 'online' : 'offline'} ${(config.PRO_MODE || !config.SHOW_ROOM_STATUS) ? 'hidden' : ''}">
              ${isActive ? 'Online' : 'Offline'}
            </div>
          </div>
          <div class="room-body ${config.PRO_MODE ? 'pro-mode' : ''}">`;
        
        if (tables.length === 0) {
          html += `
            <div class="empty-state ${config.PRO_MODE ? 'pro-mode' : ''}">
              <div class="empty-state-icon ${config.PRO_MODE ? 'pro-mode' : ''}">📭</div>
              <div class="empty-state-text ${config.PRO_MODE ? 'pro-mode' : ''}">No tables detected</div>
            </div>`;
        } else {
          html += `<div class="tables-grid ${config.PRO_MODE ? 'pro-mode' : ''}">`;
          
          tables.forEach(table => {
            let confidencePercent = Math.round(table.confidence * 100);
            let time = table.last_seen < 1000 ? 'now' : 
                       table.last_seen < 60000 ? `${Math.floor(table.last_seen/1000)}s` :
                       table.last_seen < 3600000 ? `${Math.floor(table.last_seen/60000)}m` :
                       `${Math.floor(table.last_seen/3600000)}h`;
            
            html += `
            <div class="table-item ${config.PRO_MODE ? 'pro-mode' : ''} ${table.status}">
              <div class="table-confidence ${(!config.SHOW_CONFIDENCE || config.PRO_MODE) ? 'hidden' : ''}">${confidencePercent}%</div>
              <div class="table-id ${config.PRO_MODE ? 'pro-mode' : ''}">${table.id}</div>
              <div class="table-rssi ${(!config.SHOW_RSSI || config.PRO_MODE) ? 'hidden' : ''}">${table.rssi} dBm</div>
              <div class="table-status ${(!config.SHOW_STATUS_TEXT || config.PRO_MODE) ? 'hidden' : ''}">${table.status}</div>
              <div class="table-time ${(!config.SHOW_TIME || config.PRO_MODE) ? 'hidden' : ''}">${time}</div>
            </div>`;
          });
          
          html += '</div>';
        }
        
        html += '</div></div>';
      } catch (error) {
        console.error(`❌ Error rendering room ${roomName}:`, error);
      }
    });
    
    document.getElementById('rooms').innerHTML = html;
    updateStats(roomCount, tableCount, activeCount, masterCount);
    
    console.log('✅ Render complete\n');
    
  } catch (error) {
    console.error('❌ Error in render:', error);
  }
}

// ================= HELPERS =================
function updateStatus(state, text) {
  try {
    const el = document.getElementById('status');
    if (el) {
      el.className = `status-badge ${state}`;
      el.textContent = text;
    }
  } catch (error) {
    console.error('❌ Error updating status:', error);
  }
}

function updateStats(rooms, tables, active, masters) {
  try {
    const roomsEl = document.getElementById('stat-rooms');
    const tablesEl = document.getElementById('stat-tables');
    const activeEl = document.getElementById('stat-active');
    const mastersEl = document.getElementById('stat-masters');
    
    if (roomsEl) roomsEl.textContent = rooms;
    if (tablesEl) tablesEl.textContent = tables;
    if (activeEl) activeEl.textContent = active;
    if (mastersEl) mastersEl.textContent = masters;
  } catch (error) {
    console.error('❌ Error updating stats:', error);
  }
}

function updateDebug() {
  try {
    const activeMasters = Object.values(masters).filter(m => m.active).length;
    const mastersEl = document.getElementById('debug-masters');
    const tablesEl = document.getElementById('debug-tables');
    const updatesEl = document.getElementById('debug-updates');
    const timeEl = document.getElementById('debug-time');
    
    if (mastersEl) mastersEl.textContent = activeMasters;
    if (tablesEl) tablesEl.textContent = Object.keys(tables).length;
    if (updatesEl) updatesEl.textContent = updateCount;
    
    const now = new Date();
    if (timeEl) timeEl.textContent = now.toLocaleTimeString();
  } catch (error) {
    console.error('❌ Error updating debug:', error);
  }
}

// Auto cleanup
setInterval(() => {
  try {
    console.log('⏰ Auto cleanup...');
    const now = Date.now();
    for (let tableId in tables) {
      tables[tableId].signals = tables[tableId].signals.filter(signal => {
        return (now - signal.timestamp) < CLEANUP_INTERVAL;
      });
      if (tables[tableId].signals.length === 0) {
        delete tables[tableId];
        delete tableHistory[tableId];
      }
    }
    updateDebug();
    processAndRender();
  } catch (error) {
    console.error('❌ Error in auto cleanup:', error);
  }
}, 60000);

// Init
if (!hasCachedData) {
  render({}, 0, 0, 0, 0);
}

// Apply initial display mode
applyDisplayMode();
</script>
